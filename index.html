<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>TempMail Node - Fast & Secure Temporary Email</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.materialicons.com/2.0/css/material-icons-round.css" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#3b82f6",
                        "background-light": "#f8fafc",
                        "background-dark": "#0f172a",
                        "card-dark": "#1e293b",
                        "border-dark": "#334155"
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                        display: ["Inter", "sans-serif"],
                        mono: ["JetBrains Mono", "monospace"],
                    },
                    borderRadius: {
                        DEFAULT: "0.75rem",
                    },
                },
            },
        };
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .mail-address-glow { text-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
        .message-item:hover { background: rgba(59, 130, 246, 0.05); }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen">
    
    <nav class="border-b border-slate-200 dark:border-border-dark py-4 px-6 sticky top-0 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md z-50">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-2">
                <div class="bg-primary p-2 rounded-lg flex items-center justify-center">
                    <span class="material-icons-round text-white">alternate_email</span>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">TEMPMAIL <span class="text-primary">NODE</span></h1>
                    <p class="text-[10px] uppercase tracking-widest text-slate-500 dark:text-slate-400 font-semibold">Fast • Private • Secure</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-xs font-medium text-slate-500 dark:text-slate-400 px-3 py-1 bg-slate-100 dark:bg-slate-800 rounded-full border border-slate-200 dark:border-border-dark">
                    Powered by <span class="text-primary font-bold">1SecMail</span>
                </span>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-6 py-12">
        <section class="mb-10">
            <div class="glass-card rounded-2xl p-8 shadow-2xl dark:shadow-primary/5 border-t border-white/10">
                <div class="text-center mb-6">
                    <span class="text-xs font-bold uppercase tracking-[0.2em] text-primary/80 mb-2 block">Alamat Email Sementara Anda</span>
                    <div class="relative group mt-4">
                        <div class="w-full bg-slate-100 dark:bg-slate-900/50 border-2 border-dashed border-slate-300 dark:border-primary/30 rounded-xl p-6 transition-all hover:border-primary">
                            <span id="email-display" class="font-mono text-2xl md:text-3xl text-primary font-bold break-all mail-address-glow">
                                Loading...
                            </span>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <button onclick="copyEmail()" class="flex items-center justify-center gap-2 bg-primary hover:bg-blue-600 text-white font-semibold py-4 px-6 rounded-xl transition-all shadow-lg shadow-primary/20 active:scale-95">
                        <span class="material-icons-round text-lg">content_copy</span>
                        Salin Email
                    </button>
                    <button onclick="generateNewEmail()" class="flex items-center justify-center gap-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-white font-semibold py-4 px-6 rounded-xl transition-all active:scale-95 border border-slate-300 dark:border-border-dark">
                        <span class="material-icons-round text-lg">refresh</span>
                        Buat Email Baru
                    </button>
                </div>
            </div>
        </section>

        <section class="space-y-4">
            <div class="flex items-center justify-between px-2">
                <div class="flex items-center gap-3">
                    <div class="bg-primary/10 p-2 rounded-lg">
                        <span class="material-icons-round text-primary">inbox</span>
                    </div>
                    <h2 class="text-xl font-bold dark:text-white">Kotak Masuk</h2>
                </div>
                <div class="flex items-center gap-2">
                    <span class="relative flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                    </span>
                    <span id="refresh-status" class="text-sm font-medium text-slate-500 dark:text-slate-400">Idle</span>
                </div>
            </div>

            <div id="inbox-container" class="bg-white dark:bg-card-dark border border-slate-200 dark:border-border-dark rounded-2xl overflow-hidden shadow-sm">
                <div class="p-12 flex flex-col items-center justify-center text-center">
                    <div class="w-20 h-20 bg-slate-50 dark:bg-slate-900/50 rounded-full flex items-center justify-center mb-6 text-slate-300 dark:text-slate-700">
                        <span class="material-icons-round text-4xl">email</span>
                    </div>
                    <h3 class="text-lg font-semibold mb-2 text-slate-900 dark:text-slate-100">Belum ada email masuk</h3>
                    <p class="text-slate-500 dark:text-slate-400 max-w-sm">
                        Silakan gunakan alamat email di atas untuk menerima pesan.
                    </p>
                </div>
            </div>
        </section>
    </main>

    <div id="mail-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-[60] backdrop-blur-sm">
        <div class="bg-white dark:bg-card-dark rounded-2xl max-w-2xl w-full max-h-[85vh] overflow-hidden flex flex-col shadow-2xl border border-slate-700">
            <div class="p-6 border-b border-slate-200 dark:border-border-dark flex justify-between items-center bg-slate-50 dark:bg-slate-900/50">
                <h2 id="modal-subject" class="font-bold text-xl text-primary">Subjek Email</h2>
                <button onclick="closeModal()" class="bg-slate-200 dark:bg-slate-700 p-2 rounded-full hover:bg-red-500 hover:text-white transition-all">
                    <span class="material-icons-round text-sm">close</span>
                </button>
            </div>
            <div id="modal-body" class="p-8 text-slate-700 dark:text-slate-300 overflow-y-auto leading-relaxed prose dark:prose-invert max-w-none">
                Memuat pesan...
            </div>
        </div>
    </div>

    <div class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 opacity-0 translate-y-4 transition-all pointer-events-none z-[70]" id="toast">
        <span class="material-icons-round text-green-400">check_circle</span>
        <span class="text-sm font-semibold">Email berhasil disalin!</span>
    </div>

    <script>
        let currentEmail = "";
        let autoRefresh;

        async function generateNewEmail() {
            try {
                const res = await axios.get('/gen-email');
                currentEmail = res.data.email;
                document.getElementById('email-display').innerText = currentEmail;
                checkInbox();
            } catch (err) { console.error("Error generating email"); }
        }

        function copyEmail() {
            navigator.clipboard.writeText(currentEmail);
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 2000);
        }

        async function checkInbox() {
            if(!currentEmail) return;
            document.getElementById('refresh-status').innerText = "Checking...";
            try {
                const res = await axios.get(`/get-messages?email=${currentEmail}`);
                const container = document.getElementById('inbox-container');
                
                if (res.data.length === 0) {
                    document.getElementById('refresh-status').innerText = "Waiting for messages...";
                    return;
                }

                container.innerHTML = res.data.map(mail => `
                    <div onclick="readEmail(${mail.id})" class="message-item p-6 border-b border-slate-100 dark:border-border-dark cursor-pointer transition-all flex justify-between items-center group">
                        <div class="flex-1">
                            <p class="font-bold text-primary mb-1">${mail.from}</p>
                            <p class="text-sm text-slate-600 dark:text-slate-300 font-medium">${mail.subject}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xs text-slate-400 font-mono">${mail.date}</span>
                            <span class="material-icons-round text-primary opacity-0 group-hover:opacity-100 transition-all block text-sm">arrow_forward_ios</span>
                        </div>
                    </div>
                `).join('');
                document.getElementById('refresh-status').innerText = "Updated just now";
            } catch (err) { 
                document.getElementById('refresh-status').innerText = "Error refreshing";
            }
        }

        async function readEmail(id) {
            try {
                document.getElementById('modal-body').innerText = "Loading content...";
                document.getElementById('mail-modal').classList.remove('hidden');
                const res = await axios.get(`/read-message?email=${currentEmail}&id=${id}`);
                document.getElementById('modal-subject').innerText = res.data.subject;
                document.getElementById('modal-body').innerHTML = res.data.htmlBody || `<pre class="font-sans">${res.data.textBody}</pre>`;
            } catch (err) { alert("Failed to load message"); }
        }

        function closeModal() {
            document.getElementById('mail-modal').classList.add('hidden');
        }

        // Start App
        generateNewEmail();
        // Auto check every 7 seconds
        setInterval(checkInbox, 7000);
    </script>
</body>
</html>
